<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2027 丁未羊年 | Howard Hee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root { --gold: #ffcf67; --bright-gold: #fff9c4; }
        body {
            background: #b91c1c;
            background-image: radial-gradient(circle, #e11d48 0%, #7f1d1d 100%);
            font-family: 'Noto Serif SC', serif;
            color: var(--gold);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden; margin: 0;
        }

        #cny-canvas { position: fixed; top: 0; left: 0; z-index: 0; pointer-events: none; }

        /* --- 标题字特效 --- */
        .title-fancy {
            font-family: 'Ma Shan Zheng', cursive;
            color: var(--bright-gold);
            text-shadow: 0 1px 0 #d97706, 0 2px 0 #b45309, 0 3px 0 #92400e, 0 4px 0 #78350f, 0 10px 15px rgba(0,0,0,0.6), 0 0 20px rgba(255,207,103,0.3);
            animation: titleFloat 3s infinite ease-in-out;
            letter-spacing: 0.05em;
        }

        @keyframes titleFloat {
            0%, 100% { transform: translateY(0) scale(1); filter: brightness(1); }
            50% { transform: translateY(-5px) scale(1.02); filter: brightness(1.15); }
        }

        /* --- 宫灯组件 --- */
        .lantern-hook { position: fixed; top: 0; z-index: 10; animation: swing 4s infinite ease-in-out; transform-origin: top center; }
        .l-left { left: 8%; } .l-right { right: 8%; }
        .lantern-line { width: 2px; height: 50px; background: var(--gold); margin: 0 auto; }
        .lantern-body {
            width: 85px; height: 75px; background: radial-gradient(circle at 50% 50%, #ff4d4d, #b30000);
            border: 2px solid var(--gold); border-radius: 40% / 50%;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5), 0 0 40px rgba(255, 255, 255, 0.2);
            display: flex; align-items: center; justify-content: center; position: relative;
        }
        .lantern-text { font-family: 'Ma Shan Zheng'; color: var(--gold); font-size: 32px; font-weight: bold; }
        .tassel-line {
            width: 1.5px; height: 60px; 
            background: linear-gradient(to bottom, var(--gold), #d97706, transparent);
            animation: tasselWave 4s infinite ease-in-out;
            transform-origin: top;
        }

        @keyframes swing { 0%, 100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
        @keyframes tasselWave { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }

        .main-panel {
            background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(10px);
            border: 2px solid var(--gold); border-radius: 20px;
            padding: 2rem; z-index: 5; width: 90%; max-width: 950px;
        }

        .footer-brand { position: fixed; bottom: 30px; width: 100%; text-align: center; z-index: 20; }
        .footer-text { font-size: 0.85rem; font-weight: bold; background: linear-gradient(to bottom, #fff, var(--gold)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>

    <canvas id="cny-canvas"></canvas>

    <div class="lantern-hook l-left">
        <div class="lantern-line"></div>
        <div class="lantern-body"><span class="lantern-text">吉</span></div>
        <div style="display:flex; gap:2px; justify-content:center; margin-top:-1px;">
            <div class="tassel-line"></div><div class="tassel-line" style="height:70px"></div><div class="tassel-line"></div><div class="tassel-line" style="height:75px"></div><div class="tassel-line"></div>
        </div>
    </div>
    <div class="lantern-hook l-right">
        <div class="lantern-line"></div>
        <div class="lantern-body"><span class="lantern-text">祥</span></div>
        <div style="display:flex; gap:2px; justify-content:center; margin-top:-1px;">
            <div class="tassel-line"></div><div class="tassel-line" style="height:70px"></div><div class="tassel-line"></div><div class="tassel-line" style="height:75px"></div><div class="tassel-line"></div>
        </div>
    </div>

    <div class="text-center mb-6 z-10 px-4">
        <h1 class="title-fancy text-7xl md:text-9xl mb-4">羊年大吉</h1>
        <p class="text-xl md:text-3xl tracking-[0.6em] font-bold text-[var(--gold)]">2027 · 丁未羊年</p>
    </div>

    <div class="main-panel flex flex-wrap justify-around items-center gap-4 mb-8">
        <div class="text-center"><span id="days" class="text-5xl md:text-8xl font-black block">00</span><p class="text-[10px] opacity-70">DAYS</p></div>
        <div class="text-center"><span id="hours" class="text-5xl md:text-8xl font-black block">00</span><p class="text-[10px] opacity-70">HOURS</p></div>
        <div class="text-center"><span id="minutes" class="text-5xl md:text-8xl font-black block">00</span><p class="text-[10px] opacity-70">MINS</p></div>
        <div class="text-center"><span id="seconds" class="text-5xl md:text-8xl font-black block text-yellow-400">00</span><p class="text-[10px] opacity-70">SECS</p></div>
    </div>

    <div class="z-20 text-center px-4 mb-24 max-w-4xl">
        <div id="song-name" class="text-sm mb-6 font-bold text-white/90">🧨 准备播放 🧨</div>
        <div class="flex gap-8 justify-center items-center">
            <button onclick="prevSong()" class="text-4xl">⏮</button>
            <button onclick="toggleMusic()" id="play-btn" class="bg-gradient-to-b from-[#ffcf67] to-[#d97706] text-red-950 px-10 py-3 rounded-lg font-black text-xl shadow-lg">播放音乐</button>
            <button onclick="nextSong()" class="text-4xl">⏭</button>
        </div>
        <audio id="audio-player" preload="auto"></audio>
    </div>

    <footer class="footer-brand">
        <p class="footer-text">Created by Howard Hee | 羊年新春专题网站</p>
    </footer>

    <script>
        // 1. 烟花逻辑 (增强版)
        const canvas = document.getElementById('cny-canvas');
        const ctx = canvas.getContext('2d');
        let fireworks = [], particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.onresize = resize; resize();

        class Particle {
            constructor(x, y, hue) {
                this.x = x; this.y = y; this.hue = hue;
                this.alpha = 1; this.vx = (Math.random()-0.5)*10; this.vy = (Math.random()-0.5)*10;
            }
            draw() {
                ctx.globalAlpha = this.alpha; ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI*2); ctx.fill();
            }
            update() { this.x += this.vx; this.y += this.vy; this.vy += 0.1; this.alpha -= 0.02; }
        }

        function animate() {
            ctx.fillStyle = 'rgba(185, 28, 28, 0.2)'; ctx.fillRect(0,0,canvas.width,canvas.height);
            if(Math.random()<0.08) {
                let x = Math.random()*canvas.width, y = Math.random()*canvas.height/2, h = Math.random()*360;
                for(let i=0; i<100; i++) particles.push(new Particle(x,y,h));
            }
            particles.forEach((p,i)=>{ p.update(); p.draw(); if(p.alpha<=0) particles.splice(i,1); });
            requestAnimationFrame(animate);
        }
        animate();

        // 2. 倒计时逻辑 (精准修复)
        const targetDate = new Date(2027, 1, 6, 0, 0, 0).getTime(); // 2027年2月6日

        function updateCountdown() {
            const now = Date.now();
            const diff = targetDate - now;
            if (diff <= 0) return;
            document.getElementById("days").innerText = Math.floor(diff/86400000).toString().padStart(2, '0');
            document.getElementById("hours").innerText = Math.floor((diff%86400000)/3600000).toString().padStart(2, '0');
            document.getElementById("minutes").innerText = Math.floor((diff%3600000)/60000).toString().padStart(2, '0');
            document.getElementById("seconds").innerText = Math.floor((diff%60000)/1000).toString().padStart(2, '0');
        }
        setInterval(updateCountdown, 1000);
        updateCountdown();

        // 3. 音乐逻辑 (交互增强)
        const playlist = [
            "你好我好新年好2026新年歌Danny許佳麟Jasmine张静汶MikiTew咏瑄D00nutsJiaHuiiChris官杰皓官方MV.mp3", 
            "2026马年新年歌1119 - 福气马上来OFFICIAL MV 上册.mp3", 
            "2026新年歌 Nick钟盛忠 Stella钟晓玉 Benny Angel娃娃新年好马(feat. Jayden Jayvin QiVa WeiChen) Official 4K MV.mp3", 
            "開開心心最重要 Happy Happy Important官方4K MVDanny 常勇 舒森 常樂 培永.mp3",
            "3P - 时光大耳窿 2026最振奋人心新年歌.mp3",
            "Astro 2026 新年歌灯笼挂在火箭上Lantern to the Stars 4K高清版.mp3",
            "2026人生最美是团圆.mp3"
        ];
        let cur = 0;
        const player = document.getElementById("audio-player");

        function loadSong(i) {
            player.src = playlist[i];
            player.load();
            document.getElementById("song-name").innerText = "🧨 正在播放：" + playlist[i].replace('.mp3','') + " 🧨";
        }

        function toggleMusic() {
            if(!player.src) loadSong(cur);
            if(player.paused) {
                player.play().catch(e => alert("请确保本地有对应的mp3文件！"));
                document.getElementById("play-btn").innerText = "暂停音乐";
            } else {
                player.pause();
                document.getElementById("play-btn").innerText = "播放音乐";
            }
        }
        function nextSong() { cur = (cur + 1) % playlist.length; loadSong(cur); player.play(); document.getElementById("play-btn").innerText = "暂停音乐"; }
        function prevSong() { cur = (cur - 1 + playlist.length) % playlist.length; loadSong(cur); player.play(); document.getElementById("play-btn").innerText = "暂停音乐"; }
        player.onended = nextSong;
    </script>
</body>
</html>
